spring.application.name=do-accounts-backend

# Railway 會注入 PORT 環境變數
server.port=${PORT:8080}

# MongoDB Atlas：與其他專案共用 cluster 時，靠資料庫名稱區分
# 預設指向開發用資料庫，避免本機誤連正式資料（正式環境在 Railway 設 MONGODB_DATABASE=do_accounts）
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/do_accounts_dev}
spring.mongodb.database=${MONGODB_DATABASE:do_accounts_dev}

# 登入：Google 用戶端 ID、管理員 Email、通行證簽章密鑰（正式環境務必設定 JWT_SECRET）
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.admin-email=${ADMIN_EMAIL:}
app.auth.jwt-secret=${JWT_SECRET:local-dev-secret-only-for-localhost-0000}

# 允許的前端來源（多個以逗號分隔）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Resend（選用：新帳號申請通知管理員）
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# 前端網址（Email 內連結使用）
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Actuator：只公開 health
management.endpoints.web.exposure.include=health

# JSON 欄位名稱與 Mongo 一致（snake_case）
spring.jackson.property-naming-strategy=SNAKE_CASE
# 錯誤回應採 RFC 9457 Problem Details，ResponseStatusException 的中文訊息放在 detail
spring.mvc.problemdetails.enabled=true
